<svg viewBox="0 0 1560 955" width="1560" height="955" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowId" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowMgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1560" height="955" fill="#ffffff"/>

  <!-- Title -->
  <text x="780" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">InduTechData — Architecture hybride on-premise &#8596; Cloud</text>
  <text x="780" y="72" text-anchor="middle" font-size="15" fill="#6b7280">Modernisation de la donnée temps réel avec les services Redpanda — Exercice 1</text>

  <!-- ===================== ON-PREMISE ZONE ===================== -->
  <rect x="30" y="110" width="560" height="780" rx="16" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <text x="310" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Datacenter on-premise (SI existant)</text>

  <!-- A1 IoT -->
  <rect x="60" y="175" width="220" height="66" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="170" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Capteurs IoT</text>
  <text x="170" y="224" text-anchor="middle" font-size="11" fill="#475569">+50 Go/mois (temps réel)</text>

  <!-- A2 SQL Server -->
  <rect x="60" y="265" width="220" height="66" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="170" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Cluster SQL Server</text>
  <text x="170" y="314" text-anchor="middle" font-size="11" fill="#475569">40 To — ERP / CRM</text>

  <!-- A3 SAN -->
  <rect x="60" y="355" width="220" height="66" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="170" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Baie de stockage SAN</text>
  <text x="170" y="404" text-anchor="middle" font-size="11" fill="#475569">10 To — non structuré</text>

  <!-- A4 Active Directory -->
  <rect x="60" y="445" width="220" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="475" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Active Directory</text>
  <text x="170" y="494" text-anchor="middle" font-size="11" fill="#6d28d9">Identités · Kerberos</text>

  <!-- Edge gateway -->
  <rect x="330" y="210" width="230" height="200" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="445" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Passerelle de collecte</text>
  <text x="445" y="266" text-anchor="middle" font-size="11" fill="#475569">(edge)</text>
  <text x="346" y="300" font-size="11" fill="#334155">&#8226; Clients Kafka / rpk</text>
  <text x="346" y="324" font-size="11" fill="#334155">&#8226; Agent Redpanda Connect</text>
  <text x="346" y="348" font-size="11" fill="#334155">&#8226; Bufferise &amp; sécurise</text>
  <text x="346" y="366" font-size="11" fill="#334155">&#160;&#160;les envois sortants</text>

  <!-- ===================== SECURE LINK ===================== -->
  <rect x="600" y="205" width="110" height="230" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="655" y="258" text-anchor="middle" font-size="26">&#128274;</text>
  <text x="655" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Liaison privée</text>
  <text x="655" y="318" text-anchor="middle" font-size="11" fill="#92400e">VPN / AWS</text>
  <text x="655" y="334" text-anchor="middle" font-size="11" fill="#92400e">Direct Connect</text>
  <text x="655" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Chiffrement mTLS</text>
  <text x="655" y="382" text-anchor="middle" font-size="10" fill="#a16207">VPC peering</text>

  <!-- ===================== CLOUD ZONE ===================== -->
  <rect x="730" y="110" width="800" height="780" rx="16" fill="#fff5f3" stroke="#e2401b" stroke-width="2"/>
  <text x="1130" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#b3301a">Cloud — Services Redpanda (sur compte AWS, mode BYOC)</text>

  <!-- C1 Connect MQTT -->
  <rect x="760" y="240" width="230" height="70" rx="8" fill="#ffffff" stroke="#e2401b" stroke-width="1.5"/>
  <text x="875" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#b3301a">Redpanda Connect</text>
  <text x="875" y="289" text-anchor="middle" font-size="11" fill="#475569">Source MQTT / HTTP (IoT)</text>

  <!-- C2 Connect CDC -->
  <rect x="760" y="360" width="230" height="70" rx="8" fill="#ffffff" stroke="#e2401b" stroke-width="1.5"/>
  <text x="875" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#b3301a">Redpanda Connect</text>
  <text x="875" y="409" text-anchor="middle" font-size="11" fill="#475569">Source CDC (SQL Server)</text>

  <!-- Core cluster -->
  <rect x="1040" y="200" width="320" height="300" rx="12" fill="#ffffff" stroke="#e2401b" stroke-width="2"/>
  <path d="M 1040 240 L 1040 212 Q 1040 200 1052 200 L 1348 200 Q 1360 200 1360 212 L 1360 240 Z" fill="#e2401b"/>
  <text x="1200" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Redpanda Cloud — BYOC</text>
  <text x="1200" y="259" text-anchor="middle" font-size="11" fill="#6b7280">Cluster compatible Kafka</text>

  <!-- topic chips -->
  <rect x="1065" y="272" width="130" height="30" rx="6" fill="#fee2e2" stroke="#e2401b" stroke-width="1"/>
  <text x="1130" y="291" text-anchor="middle" font-size="11" fill="#b3301a">iot.sensors</text>
  <rect x="1205" y="272" width="130" height="30" rx="6" fill="#fee2e2" stroke="#e2401b" stroke-width="1"/>
  <text x="1270" y="291" text-anchor="middle" font-size="11" fill="#b3301a">erp.cdc</text>
  <rect x="1065" y="310" width="130" height="30" rx="6" fill="#fee2e2" stroke="#e2401b" stroke-width="1"/>
  <text x="1130" y="329" text-anchor="middle" font-size="11" fill="#b3301a">client_tickets</text>
  <rect x="1205" y="310" width="130" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="1270" y="329" text-anchor="middle" font-size="11" fill="#475569">… autres topics</text>

  <!-- schema registry chip -->
  <rect x="1065" y="352" width="270" height="32" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="1200" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Schema Registry (Avro / JSON / Protobuf)</text>

  <!-- security chip -->
  <rect x="1065" y="392" width="270" height="32" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="1200" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">RBAC + ACL · chiffrement en transit/repos</text>

  <text x="1200" y="448" text-anchor="middle" font-size="10" fill="#94a3b8">Partitionnement &amp; réplication intégrés</text>

  <!-- E1 Tiered storage / S3 -->
  <rect x="1380" y="210" width="150" height="84" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1455" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Tiered Storage</text>
  <text x="1455" y="256" text-anchor="middle" font-size="11" fill="#475569">&#8594; Amazon S3</text>
  <text x="1455" y="276" text-anchor="middle" font-size="10" fill="#475569">(Iceberg, rétention)</text>

  <!-- E2 Console -->
  <rect x="1380" y="330" width="150" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="1455" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Redpanda Console</text>
  <text x="1455" y="379" text-anchor="middle" font-size="10" fill="#475569">supervision · ACL</text>

  <!-- D2 PySpark -->
  <rect x="1040" y="560" width="320" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1200" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">PySpark / Spark Structured Streaming</text>
  <text x="1200" y="609" text-anchor="middle" font-size="11" fill="#475569">ETL temps réel &#8594; Exercice 2</text>

  <!-- E3 lakehouse -->
  <rect x="1380" y="560" width="150" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1455" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Lakehouse / BI</text>
  <text x="1455" y="609" text-anchor="middle" font-size="10" fill="#475569">(Iceberg sur S3)</text>

  <!-- ===================== ARROWS (data flow) ===================== -->
  <line x1="280" y1="208" x2="328" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="298" x2="328" y2="305" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="388" x2="328" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="310" x2="598" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="300" x2="758" y2="275" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="734" y="280" text-anchor="middle" font-size="9" fill="#64748b">IoT</text>
  <line x1="710" y1="345" x2="758" y2="395" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="734" y="378" text-anchor="middle" font-size="9" fill="#64748b">CDC</text>
  <line x1="990" y1="275" x2="1038" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="395" x2="1038" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1360" y1="250" x2="1378" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="500" x2="1200" y2="558" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1212" y="540" font-size="10" fill="#64748b">consume / stream</text>
  <line x1="1360" y1="595" x2="1378" y2="595" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Identity federation (dashed purple) -->
  <polyline points="280,478 1012,478 1012,408 1038,408" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowId)"/>
  <text x="640" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">Fédération d'identité — Kerberos / OIDC (SSO)</text>

  <!-- Management (dashed grey): Console -> cluster -->
  <polyline points="1380,375 1372,375 1372,468 1362,468" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrowMgmt)"/>

  <!-- ===================== LEGEND ===================== -->
  <rect x="30" y="905" width="1500" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="55" y1="925" x2="95" y2="925" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="105" y="929" font-size="12" fill="#334155">Flux de données (streaming)</text>
  <line x1="330" y1="925" x2="370" y2="925" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowId)"/>
  <text x="380" y="929" font-size="12" fill="#334155">Identité / fédération (Kerberos, OIDC)</text>
  <line x1="690" y1="925" x2="730" y2="925" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrowMgmt)"/>
  <text x="740" y="929" font-size="12" fill="#334155">Administration / supervision</text>
  <text x="1010" y="929" font-size="14">&#128274;</text>
  <text x="1035" y="929" font-size="12" fill="#334155">Chiffrement &amp; liaison privée (mTLS, VPN/Direct Connect)</text>
</svg>
